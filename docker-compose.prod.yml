services:
  app:
    image: ghcr.io/lou270/gestion-locative:latest
    container_name: gestion-locative
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Persistance des données (SQLite, Uploads PDF, etc)
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # The database URL is now hardcoded in schema.prisma to file:../data/dev.db
      # Ces variables seront lues depuis le fichier .env sur le serveur
      - YOUSIGN_API_KEY=${YOUSIGN_API_KEY}
      - YOUSIGN_API_URL=${YOUSIGN_API_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
