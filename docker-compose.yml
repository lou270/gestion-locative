services:
  app:
    container_name: gestion-locative
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
    environment:
      # The database URL is now hardcoded in schema.prisma to file:../data/dev.db
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_TRUST_HOST=true
    # Optional: Run migrations on startup (requires prisma CLI in the runner image or a separate step)
    # For SQLite, it's simpler to ensure the DB file exists or use 'npx prisma db push' if included.
    # Since we are using standalone output, the 'server.js' starts the app.
    # To run migrations, we might need a custom entrypoint script.
    # For now, we assume the user will handle initial migration or we can add a script.
