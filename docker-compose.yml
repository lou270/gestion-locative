services:
  app:
    image: ghcr.io/lou270/rental-management:latest
    container_name: gestion-locative
    restart: unless-stopped
    # Le conteneur écrit la base SQLite dans le volume monté : il doit tourner
    # sous le propriétaire du dossier hôte, sinon SQLite échoue à l'ouverture.
    # 1000 est l'uid du premier compte créé sur la plupart des serveurs Linux ;
    # `id -u` le confirme, et APP_UID / APP_GID permettent de l'ajuster.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      # Persistance des données (SQLite, Uploads PDF, etc)
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # The database URL is now hardcoded in schema.prisma to file:../data/dev.db
      # Ces variables seront lues depuis le fichier .env sur le serveur
      - YOUSIGN_API_KEY=${YOUSIGN_API_KEY}
      - YOUSIGN_API_URL=${YOUSIGN_API_URL}
      # Obligatoire pour que le webhook Yousign soit accepté (signature HMAC).
      - YOUSIGN_WEBHOOK_SECRET=${YOUSIGN_WEBHOOK_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_TRUST_HOST=true
      # 1 seulement si un reverse proxy est devant : la limitation des
      # tentatives de connexion ne lit X-Forwarded-For que dans ce cas.
      # En exposition directe, l'en-tête serait fourni par l'attaquant.
      - TRUST_PROXY=${TRUST_PROXY:-0}
